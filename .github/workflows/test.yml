name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # Installs pnpm first so setup-node can find it
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm' # Enables pnpm caching and activates pnpm automatically

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test